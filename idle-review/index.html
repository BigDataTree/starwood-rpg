<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星森傳說｜001–100 待機驗收</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3ef;color:#173b31;font:15px system-ui}header{position:sticky;top:0;z-index:2;background:white;padding:10px;border-bottom:1px solid #bfcfc4}button,select{padding:7px;margin:3px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:8px;padding:8px}article{background:white;border:1px solid #cbd8cf;border-radius:8px;text-align:center;padding:8px;overflow:auto}canvas{display:block;image-rendering:pixelated;max-width:100%;height:auto;margin:5px auto}.pair{display:flex;justify-content:center;gap:4px}.pair[hidden]{display:none}.pair canvas{max-width:48%}small{color:#53685d}a{color:#17634b}</style><header><b>001–100｜待機驗收室</b><div><button id="play">暫停</button><button id="step">下一格</button><select id="speed"><option value="250">250 ms</option><option selected value="500">500 ms</option><option value="750">750 ms</option><option value="1000">1000 ms</option></select><select id="zoom"><option value="1">1×</option><option selected value="2">2×</option><option value="4">4×</option><option value="8">8×</option><option value="16">16×</option></select><label><input id="grid" type="checkbox">格線</label> <label><input id="pair" type="checkbox">雙格並排</label></div><small id="status">載入中</small></header><main id="cards"></main><script src="source-1.js"></script><script src="source-2.js"></script><script src="source-3.js"></script><script src="source-4.js"></script><script>
const el=id=>document.getElementById(id), cards=el('cards'), sheets=[];let frame=0,playing=true,prev=0;
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
async function build(b){const img=new Image();img.src='data:image/png;base64,'+b;await img.decode();if(img.width!==513||img.height!==513)throw Error('source size');const src=makeCanvas(513,513), ctx=src.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);const raw=ctx.getImageData(0,0,513,513).data;const a=new Uint8ClampedArray(64*64*4),white=new Uint8Array(4096),bg=new Uint8Array(4096),queue=[];for(let y=0;y<64;y++)for(let x=0;x<64;x++){let i=y*64+x,j=((y*8+4)*513+x*8+4)*4;a[i*4]=raw[j];a[i*4+1]=raw[j+1];a[i*4+2]=raw[j+2];a[i*4+3]=255;white[i]=raw[j]===255&&raw[j+1]===255&&raw[j+2]===255?1:0;if((x===0||x===63||y===0||y===63)&&white[i]){bg[i]=1;queue.push(i)}}for(let q=0;q<queue.length;q++){const i=queue[q],x=i%64,y=i>>6;for(const j of [x>0?i-1:-1,x<63?i+1:-1,y>0?i-64:-1,y<63?i+64:-1])if(j>=0&&white[j]&&!bg[j]){bg[j]=1;queue.push(j)}}let top=64,bottom=-1;for(let i=0;i<4096;i++){if(bg[i])a.fill(0,i*4,i*4+4);else{top=Math.min(top,i>>6);bottom=Math.max(bottom,i>>6)}}if(bottom<0)throw Error('empty');const f2=new Uint8ClampedArray(a),cut=bottom-12;f2.fill(0,0,(top+1)*256);for(let y=top+1;y<cut;y++){const sy=top+Math.floor((y-top-1)*(cut-top)/(cut-top-1));f2.set(a.subarray(sy*256,(sy+1)*256),y*256)}const sheet=makeCanvas(128,64),c=sheet.getContext('2d');c.putImageData(new ImageData(a,64,64),0,0);c.putImageData(new ImageData(f2,64,64),64,0);return sheet}
function paint(cv,sheet,f,s){cv.width=cv.height=64*s;const c=cv.getContext('2d');c.imageSmoothingEnabled=false;c.drawImage(sheet,f*64,0,64,64,0,0,64*s,64*s);if(el('grid').checked&&s>1){c.strokeStyle='#9da7a0';c.lineWidth=.5;for(let k=0;k<=64;k++){c.beginPath();c.moveTo(k*s,0);c.lineTo(k*s,64*s);c.moveTo(0,k*s);c.lineTo(64*s,k*s);c.stroke()}}}
function draw(){let s=+el('zoom').value,p=el('pair').checked;for(let i=0;i<sheets.length;i++){let a=cards.children[i];paint(a.querySelector('canvas'),sheets[i],frame,s);a.querySelector('.pair').hidden=!p;if(p)a.querySelectorAll('.pair canvas').forEach((cv,j)=>paint(cv,sheets[i],j,s))}}
async function init(){try{if(window.SPRITES.length!==100)throw Error('source count');let all=await Promise.all(window.SPRITES.map(build));all.forEach((sheet,i)=>{sheets.push(sheet);let a=document.createElement('article'),n=String(i+1).padStart(3,'0');a.innerHTML='<b>'+n+'</b><canvas></canvas><div class="pair" hidden><canvas></canvas><canvas></canvas></div><a download="'+n+'_idle.png">PNG</a>';a.querySelector('a').href=sheet.toDataURL('image/png');cards.append(a)});el('status').textContent='100/100｜原網格還原・雙格呼吸初版・不減色・腳底固定';draw();requestAnimationFrame(tick)}catch(e){el('status').textContent='載入失敗：'+e.message}}function tick(t){if(playing&&t-prev>=+el('speed').value){frame=1-frame;prev=t;draw()}requestAnimationFrame(tick)}el('play').onclick=()=>{playing=!playing;el('play').textContent=playing?'暫停':'播放'};el('step').onclick=()=>{playing=false;el('play').textContent='播放';frame=1-frame;draw()};for(let k of ['grid','zoom','pair'])el(k).onchange=draw;init();</script></html>
