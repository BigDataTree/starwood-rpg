name: Starwood RPG 5-minute static audit

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starwood-rpg-static-audit
  cancel-in-progress: true

jobs:
  inspect-development-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout development branch (read-only)
        uses: actions/checkout@v4
        with:
          ref: automation/npc-sprite-audit-20261120
          persist-credentials: false
      - name: Log inspected revision
        shell: bash
        run: |
          echo "GITHUB_AUDIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "GITHUB_AUDIT_BRANCH=automation/npc-sprite-audit-20261120" >> "$GITHUB_ENV"
      - name: Validate HTML and art file structure
        run: node scripts/audit-game.mjs
