<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>星森傳說 v1.1.8｜前11位四方向精靈驗收</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1b23;color:#e9f1e8;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif}header,main{max-width:1060px;margin:auto;padding:20px}h1{font-size:clamp(22px,4vw,31px);color:#f0d695}p{color:#bad0c7;line-height:1.7}a{color:#f1d596}a.link{display:inline-block;background:#2b5646;border:1px solid #78ab90;color:#fff;padding:12px 15px;border-radius:10px;text-decoration:none;margin:4px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.card{background:#193139;border:1px solid #44655c;border-radius:15px;padding:16px}.card h2{font-size:17px;color:#e9daaa;margin:0 0 12px}.views{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}.views figure{margin:0;text-align:center}.views canvas{image-rendering:pixelated;width:100%;aspect-ratio:1;background:#29443d;border-radius:6px}.views figcaption{font-size:12px;margin-top:5px}.atlas{display:block;width:192px;max-width:100%;height:auto;image-rendering:pixelated;margin:10px auto;border:1px solid #517164;background:#223a39}.fine{font-size:13px}.card a{display:inline-block;margin-top:9px}.notice{border-top:1px solid #466c62;padding-top:15px;margin-top:24px}</style></head><body><header><h1>🌲 星森傳說 v1.1.8｜四方向行走圖集</h1><p>第 1～11 位新圖集已接入遊戲（每位 12 格、每格 64×64），可同時檢查真正的正面、左側、右側與背面動作。第 12～20 位仍保留 v1.1.7 原圖，尚未完成重繪。</p><a class="link" href="./">▶ 開啟最新版 RPG</a><a class="link" href="./?download=1">下載離線 HTML</a><a class="link" href="./?download=zip">下載離線 ZIP</a></header>
<main><div class="cards" id="cards"></div><section class="notice"><h2>下一批狀態</h2><p>第 12～20 位角色：孩童、嚮導、斥候、營地商人、營地治療師、旅人、暮影首領、伐木工、暮影商人仍待逐角色原創重繪。本頁不把舊圖標成新品。</p></section></main><script>
const list=[["01","novice","主角"],["02","knight","騎士"],["03","mage","法師"],["04","ranger","遊俠"],["05","elder","村長"],["06","merchant","商人"],["07","smith","鐵匠"],["08","trainer","訓練師"],["09","healer","治療師"],["10","guard","守衛"],["11","librarian","圖書管理員"]], grid=document.getElementById('cards'),cards=[];let phase=0;
for(const [number,id,label] of list){const card=document.createElement('article');card.className='card';card.innerHTML='<h2>'+number+'・'+label+'</h2><div class="views"></div><img class="atlas" alt="'+label+'12格圖集"><a download="'+number+'_'+id+'_192x256.png">下載 PNG 圖集</a><p class="fine">正面／左側／右側／背面；左腳前／站立／右腳前</p>';grid.append(card);const url='assets/walk64-v118/'+number+'_'+id+'_64x64_4dir_3walk.png',im=new Image();im.src=url;card.querySelector('img').src=url;card.querySelector('a').href=url;const views=[];for(let i=0;i<4;i++){const figure=document.createElement('figure'),cv=document.createElement('canvas');cv.width=64;cv.height=64;figure.append(cv);const caption=document.createElement('figcaption');caption.textContent=['正面','左側','右側','背面'][i];figure.append(caption);card.querySelector('.views').append(figure);views.push(cv)}cards.push({im,views});}
setInterval(()=>{phase=(phase+1)%4;const f=[1,0,1,2][phase];for(const {im,views} of cards){if(!im.complete||im.naturalWidth!==192||im.naturalHeight!==256)continue;views.forEach((cv,d)=>{const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,64,64);ctx.drawImage(im,64*f,64*d,64,64,0,0,64,64)})}},170);
</script></body></html>
