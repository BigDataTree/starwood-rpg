<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>001 v5 動態驗收</title><style>body{font-family:system-ui;background:#f4f5f7;color:#182333;margin:20px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}section{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px;text-align:center}canvas{width:192px;max-width:none;image-rendering:pixelated;background:#e5e7eb}button,select{font:inherit;padding:8px;margin:5px} .frames{display:flex;justify-content:center;gap:3px}.frames canvas{width:64px;max-width:32%}</style><h2>001 號 · PNG 完整性驗證版</h2><p>每方向三影格；中央為站立。原始 PNG 驗證版</p><button id="toggle">暫停</button><button id="step">逐格</button><button id="stand">站立</button><label>速度 <select id="speed"><option value="250">250 ms</option><option value="500">500 ms</option><option value="125">125 ms</option></select></label><main id="main"></main><script>const img=new Image();img.src="sprites.png";let playing=true,k=0,last=0;const order=[0,1,2,1];const views=[];for(const [i,n] of ['正面／向下','向左','向右','背面／向上'].entries()){const s=document.createElement('section');s.innerHTML=`<h3>${n}</h3><canvas width="64" height="64"></canvas><p>三格對照</p><div class="frames">${'<canvas width="64" height="64"></canvas>'.repeat(3)}</div>`;main.append(s);views.push([...s.querySelectorAll('canvas')]);}function draw(c,r,f){let x=c.getContext('2d');x.clearRect(0,0,64,64);x.imageSmoothingEnabled=false;x.drawImage(img,f*64,r*64,64,64,0,0,64,64)}function paint(){views.forEach((v,r)=>draw(v[0],r,order[k]))}img.onload=()=>{views.forEach((v,r)=>v.slice(1).forEach((c,f)=>draw(c,r,f)));paint();requestAnimationFrame(loop)};function loop(t){if(playing&&t-last>=+speed.value){k=(k+1)%4;last=t;paint()}requestAnimationFrame(loop)}toggle.onclick=()=>{playing=!playing;toggle.textContent=playing?'暫停':'播放'};step.onclick=()=>{playing=false;toggle.textContent='播放';k=(k+1)%4;paint()};stand.onclick=()=>{playing=false;toggle.textContent='播放';k=1;paint()};</script></html>
