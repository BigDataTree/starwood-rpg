<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>角色動態驗收室</title><style>
*{box-sizing:border-box}html{scroll-snap-type:y mandatory;scroll-padding-top:0}body{margin:0;background:#f4f5f7;color:#182333;font:14px system-ui,sans-serif}article{height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 8px max(8px,env(safe-area-inset-bottom));gap:6px}h1{font-size:18px;margin:0}header{display:flex;align-items:center;justify-content:space-between;width:min(100%,600px)}nav{display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap}button,select,a{font:inherit}button,select{padding:5px 8px;border:1px solid #b7c0cd;border-radius:6px;background:white;color:inherit}a{color:#245e9b} .directions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;width:min(100%,600px);min-height:0;flex:1;max-height:620px}.direction{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:white;border:1px solid #d8dde4;border-radius:9px;padding:4px}h2{font-size:13px;margin:0}canvas{display:block;image-rendering:pixelated;background:#e5e7eb;flex-shrink:0}.motion{width:var(--motion,128px);height:var(--motion,128px)}.frames{display:flex;gap:2px}.frames canvas{width:var(--thumb,48px);height:var(--thumb,48px)}footer{font-size:12px;color:#596574;display:flex;gap:12px;align-items:center} .status{font-size:11px;color:#596574} @media(max-height:420px){article{gap:2px;padding:3px}.directions{gap:3px}.direction{gap:1px;padding:2px}h1{font-size:14px}h2{font-size:11px}button,select{padding:2px 5px}footer{font-size:10px}}
.workspace{display:grid;grid-template-columns:minmax(0, 2fr) minmax(0,1fr);gap:6px;width:min(100%,900px);min-height:0;flex:1;max-height:720px}.workspace .directions{width:100%;max-height:none;min-height:0;grid-template-rows:repeat(2,minmax(0,1fr))}.portrait{display:flex;flex-direction:column;min-width:0;min-height:0;border:1px solid #d8dde4;border-radius:9px;background:white;padding:5px;gap:5px;text-align:center}.portrait-stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;border-radius:5px;background-color:#fafafa;background-image:conic-gradient(#e4e7eb 25%,#fafafa 0 50%,#e4e7eb 0 75%,#fafafa 0);background-size:16px 16px}.portrait-stage img{position:absolute;width:100%;height:100%;object-fit:contain;object-position:center}.portrait-stage.white{background:white}.portrait-stage.dark{background:#334155}.portrait-empty{color:#596574;font-size:11px;padding:6px}.portrait-controls{display:flex;justify-content:center;gap:3px;flex-wrap:wrap}.portrait-controls button{font-size:11px;padding:3px 5px}.portrait-open{font-size:11px}header{width:min(100%,900px)}@media(orientation:portrait){.workspace{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,2fr) minmax(0,1fr)}.portrait{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);grid-template-rows:auto 1fr;align-items:center}.portrait-stage{grid-column:2;grid-row:1 / 3;height:100%}.portrait-controls{grid-column:1;grid-row:2}.portrait h2{grid-column:1;grid-row:1}}@media(max-height:420px){.portrait{padding:2px;gap:2px}.portrait-controls button{padding:2px;font-size:10px}}
</style></head><body><main id="gallery"></main><script>
const characters=[{id:"001",version:"v5",portrait:"portraits/001.png",src:"../walk-review-001-verified/sprites.png",sha:"231a33d04132292007cbbbdc107225ebf101a382"},{id:"002",version:"v6",portrait:"portraits/002.png",src:"../walk-review-002-v6/sprites.png",sha:"ee2bf25a28c9b47e008f4fc20c9ea114535c1d0b"}];
const order=[0,1,2,1], names=["正面／向下","向左","向右","背面／向上"], states=[];
function draw(s,c,r,f){const ctx=c.getContext("2d");ctx.clearRect(0,0,64,64);ctx.imageSmoothingEnabled=false;ctx.drawImage(s.img,f*64,r*64,64,64,0,0,64,64)}
function paint(s){if(s.ready)s.views.forEach((v,r)=>draw(s,v[0],r,order[s.k]))}
function resize(s){const cell=s.page.querySelector(".direction");const w=cell.clientWidth-10,h=cell.clientHeight-25;const max=Math.min(w,Math.floor((h-4)*.67));const motion=max>=192?192:max>=128?128:max>=64?64:Math.max(16,max);const thumb=Math.max(16,Math.min(64,Math.floor((w-4)/3),h-motion-4));s.page.style.setProperty("--motion",motion+"px");s.page.style.setProperty("--thumb",thumb+"px")}
characters.forEach((ch,i)=>{const page=document.createElement("article");page.id="character-"+ch.id;page.innerHTML='<header><h1>'+ch.id+' 號 · '+ch.version+'</h1><span>'+ (i+1)+' / '+characters.length+'</span></header><nav><button data-toggle>暫停</button><button data-step>逐格</button><button data-stand>站立</button><select aria-label="速度"><option value="250">250 ms</option><option value="500">500 ms</option><option value="125">125 ms</option></select></nav><div class="workspace"><div class="directions"></div><aside class="portrait"><h2>全身立繪</h2><div class="portrait-stage"><span class="portrait-empty">待放置透明背景立繪</span></div><div class="portrait-controls"><button data-bg="">棋盤</button><button data-bg="white">白</button><button data-bg="dark">深</button></div></aside></div><footer><span class="status" role="status">載入中</span><a href="'+ch.src+'">原始 PNG</a><span>上下滑動切換</span></footer>';document.getElementById("gallery").append(page);const stage=page.querySelector(".portrait-stage");page.querySelectorAll("[data-bg]").forEach(b=>b.onclick=()=>{stage.className="portrait-stage "+b.dataset.bg;page.querySelectorAll("[data-bg]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)))});page.querySelector("[data-bg]").setAttribute("aria-pressed","true");if(ch.portrait){const pic=new Image();pic.alt=ch.id+" 號全身立繪";pic.onload=()=>{stage.replaceChildren(pic);const a=document.createElement("a");a.href=ch.portrait;a.target="_blank";a.rel="noopener";a.className="portrait-open";a.textContent="原圖";page.querySelector(".portrait-controls").append(a)};pic.onerror=()=>stage.querySelector(".portrait-empty").textContent="立繪載入失敗";pic.src=ch.portrait;}const s={page,img:new Image(),views:[],k:0,last:0,playing:true,ready:false,visible:i===0,speed:page.querySelector("select")};states.push(s);names.forEach(n=>{const cell=document.createElement("section");cell.className="direction";cell.innerHTML='<h2>'+n+'</h2><canvas class="motion" width="64" height="64"></canvas><div class="frames">'+ '<canvas width="64" height="64"></canvas>'.repeat(3)+'</div>';page.querySelector(".directions").append(cell);s.views.push([...cell.querySelectorAll("canvas")])});const toggle=page.querySelector("[data-toggle]");function setPlaying(v){s.playing=v;toggle.textContent=v?"暫停":"播放"}toggle.onclick=()=>setPlaying(!s.playing);page.querySelector("[data-step]").onclick=()=>{setPlaying(false);s.k=(s.k+1)%4;paint(s)};page.querySelector("[data-stand]").onclick=()=>{setPlaying(false);s.k=1;paint(s)};s.img.onload=()=>{if(s.img.naturalWidth!==192||s.img.naturalHeight!==256){page.querySelector(".status").textContent="尺寸錯誤";return}s.ready=true;s.views.forEach((v,r)=>v.slice(1).forEach((c,f)=>draw(s,c,r,f)));paint(s);page.querySelector(".status").textContent="64px · 12 格"};s.img.onerror=()=>page.querySelector(".status").textContent="圖檔載入失敗";s.img.src=ch.src;new ResizeObserver(()=>resize(s)).observe(page.querySelector(".direction"));resize(s)});
const io=new IntersectionObserver(entries=>entries.forEach(e=>{const s=states.find(s=>s.page===e.target);s.visible=e.isIntersecting}),{threshold:.05});states.forEach(s=>io.observe(s.page));function loop(t){states.forEach(s=>{if(s.visible&&s.ready&&s.playing&&t-s.last>=Number(s.speed.value)){s.k=(s.k+1)%4;s.last=t;paint(s)}});requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
