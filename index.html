function sideOptions(id,opts){let rec=s.side[id];const q=SIDES[id];if(!rec){opts.push({title:'接取支線：'+q.title,detail:q.desc,primary:true,action:()=>addSide(id)})}else if(rec.completed){opts.push({title:'已完成 ✓',detail:'感謝你幫助了星森的居民',disabled:true})}else if(sideReady(id)){opts.push({title:'繳交任務・領取報酬',detail:`${q.reward} 金幣、${q.xp} 經驗、${q.bonus}`,primary:true,action:()=>finishSide(id)})}else{opts.push({title:'查看採集與討伐進度',detail:q.requirements.map(([k,n])=>`${labelMetric(k)} ${sideProgress(id,k)}/${n}`).join('、'),disabled:true})}}
function shopDialogue(id){nextPortrait=id;let body='<p>「踏入野外前，記得帶好藥水。好的補給有時比鋒利的劍更可靠。」</p><div class="tag">購買後立即放進背包</div><div class="tag">無需網路・遊戲金幣</div>';

function buy(kind,count,id){let cost=kind==='potion'?(count===5?90:20):kind==='rest'?30:40;if(s.gold<cost)return;s.gold-=cost;if(kind==='potion')s.potions+=count;if(kind==='rest'){s.hp=s.maxHp;s.mp=s.maxMp}if(kind==='dust'){s.inventory.dust++;s.count.dust++}toast('購買成功！花費 '+cost+' 金幣');updateHud();save(true);shopDialogue(id)}
function smithDialogue(){nextPortrait='smith';const wp=(s.weapon+1)*65+25,ar=(s.armor+1)*55+25;const discount=s.oreDiscount?0.8:1;const wCost=Math.round(wp*discount),aCost=Math.round(ar*discount);let body=`<p>「這把鐵鎚打的不只是裝備，也是旅人活著回家的機會。」</p><div class="tag">武器 +${s.weapon} · 攻擊 +${s.weapon*8}</div><div class="tag">護甲 +${s.armor} · 防禦 +${s.armor*4}</div><p>強化材料：每次需 1 份精鐵礦（初次強化免費材料）；目前持有 ${s.inventory.ore} 塊。</p>`;
 let opts=[{title:'⚔️ 購買／強化武器 +'+(s.weapon+1),detail:`花費 ${wCost} 金幣，攻擊 +8`,disabled:s.gold<wCost||s.weapon>=8||(s.weapon>0&&s.inventory.ore<1),action:()=>upgrade('weapon',wCost)},{title:'🛡️ 購買／強化護甲 +'+(s.armor+1),detail:`花費 ${aCost} 金幣，防禦 +4`,disabled:s.gold<aCost||s.armor>=8||(s.armor>0&&s.inventory.ore<1),action:()=>upgrade('armor',aCost)}];sideOptions('ore',opts);opts.push({title:'離開鍛造坊',primary:true});modalShow('⚒️ 布洛的鍛造坊',body,opts,'✦ BLACKSMITH · UPGRADE ✦')}

function trainerDialogue(){nextPortrait='trainer';let C=CLASSES[s.cls],body='<p>「每位冒險者終會走上不同道路。選擇職業、通過專屬試煉，便能學到兩個全新的職業技能。」</p>';

 else if(s.level<2){body+='<p class="red">初次轉職需要 Lv.2。擊退草原怪物取得經驗後再來找我。</p>';opts.push({title:'等級尚不足',detail:'目前 Lv.'+s.level+' / 需要 Lv.2',disabled:true})}
 else{if(s.classTrial){const t=s.classTrial,cl=CLASSES[t.id],n=metricCount(cl.metric)-t.start;body+=`<p>目前試煉：<b>${cl.icon} ${cl.name}</b><br>${cl.req}<br><span class="gold">進度 ${Math.max(0,n)}/${cl.need}</span></p>`;if(n>=cl.need)opts.push({title:'✨ 完成轉職：'+cl.name,detail:`${cl.bonus}；獲得職業雙技能`,primary:true,action:()=>promote(t.id)});else opts.push({title:'試煉尚未完成',detail:`${Math.max(0,n)} / ${cl.need}`,disabled:true});opts.push({title:'放棄並更換試煉',detail:'重選職業會重置原試煉進度',action:()=>{s.classTrial=null;trainerDialogue()}})}else for(const id of ['knight','mage','ranger']){let cl=CLASSES[id];opts.push({title:cl.icon+' '+cl.name,detail:cl.desc+'｜試煉：'+cl.req,action:()=>{s.classTrial={id,start:metricCount(cl.metric)};toast('已接取'+cl.name+'轉職試煉');save(true);trainerDialogue()}})}}
 opts.push({title:'改天再來',primary:true});modalShow('🧝 轉職導師・黎恩',body,opts,'✦ CLASS ADVANCEMENT ✦')}
function promote(id){if(s.cls!=='novice'||!s.classTrial)return;s.cls=id;if(id==='knight'){s.maxHp+=55;s.hp+=55}else if(id==='mage'){s.maxMp+=70;s.mp+=70}else if(id==='ranger'){}s.classTrial=null;s.hp=s.maxHp;s.mp=s.maxMp;emit(hero.x,hero.y,'#ffe5ac',38,225);log('轉職為 '+CLASSES[id].name+'，解鎖 '+CLASSES[id].q+' 與 '+CLASSES[id].e);toast('✨ 轉職成功：'+CLASSES[id].name+'！');updateHud();save(true);modalShow('轉職成功！',`<div class="introart">${CLASSES[id].icon} ✨ ✦</div><p>你已成為 <b>${CLASSES[id].name}</b>。現在 Q 是「${CLASSES[id].q}」，E 是「${CLASSES[id].e}」。${CLASSES[id].bonus}。</p>`,[{title:'開始新的職業冒險',primary:true}])}
function bountyBoard(){let body='<p>懸賞可重複接取；每次接取後開始計算擊敗數量。最多可同時領取 3 件，並可於任一安全區佈告欄領賞。</p><div class="tag">已完成 '+s.bountyDone+' 張懸賞</div>';let opts=[];for(const [id,q] of Object.entries(BOUNTIES)){let b=s.bounties.find(x=>x.id===id),progress=b?bountyProgress(b):0,unlock=canGo(id==='slime'||id==='wolf'?'field':id);opts.push(b?{title:(progress>=q.count?'✅ ':'⏳ ')+q.title,detail:`進度 ${Math.min(progress,q.count)}/${q.count} · 獎勵 ${q.reward} 金幣 + ${q.xp} XP`,disabled:progress<q.count,action:()=>bountyTurn(id)}:{title:'📜 '+q.title,detail:`${q.area} · 擊敗 ${q.count} 名 · ${q.reward} 金幣`,disabled:!unlock||s.bounties.length>=3,action:()=>bountyAccept(id)})}opts.push({title:'返回冒險',primary:true,full:true});modalShow('📜 冒險者公會・懸賞欄',body,opts,'✦ HUNTER BOARD ✦')}

function renderSide(){const body=$('sideBody');if(!body)return;const q=mainTask();let html='';
 if(currentTab==='quest'){
 html+=`<div class="section-title">MAIN STORY · ${q.chapter}</div><div class="q-title">✦ ${q.name}</div><p class="q-text">${q.text}</p><div class="tag">📍 ${q.where}</div>`;
 for(const [title,n,goal] of q.tasks){const done=n>=goal;html+=`<div class="task ${done?'done':''}">${done?'✓':'◻'} ${title}<span style="float:right">${Math.min(n,goal)}/${goal}</span><div class="progress"><i style="width:${100*Math.min(n/goal,1)}%"></i></div></div>`}
 if(s.classTrial&&s.cls==='novice'){let c=CLASSES[s.classTrial.id],n=Math.max(0,metricCount(c.metric)-s.classTrial.start);html+=`<div class="subhead"><b>✨ 轉職試煉 · ${c.name}</b></div><div class="task">${c.req}　${n}/${c.need}<div class="progress"><i style="width:${Math.min(100,100*n/c.need)}%"></i></div></div>`}
 const active=Object.entries(s.side).filter(([,v])=>!v.completed);html+=`<div class="subhead"><b>🌼 支線任務（${active.length} 進行中）</b><small>${Object.values(s.side).filter(x=>x.completed).length} 已完成</small></div>`;
 if(!active.length)html+='<p class="muted">與不同安全區的居民交談，即可開啟支線故事。</p>';
 for(const [id] of active){const item=SIDES[id];html+=`<div class="task">${sideReady(id)?'✅':'◻'} <b>${item.title}</b><br><em>${item.requirements.map(([k,n])=>`${labelMetric(k)} ${Math.min(sideProgress(id,k),n)}/${n}`).join('、')}</em></div>`}

const V6_AREA_PORTRAITS={"town": ["elder", "merchant", "smith", "trainer", "healer", "guard", "librarian", "child", "guide", "baker_lumi", "florist_nia", "innkeeper_doran", "ambient_town_0", "ambient_town_1", "ambient_town_2", "ambient_town_3", "ambient_town_4", "ambient_town_5", "ambient_town_6", "ambient_town_7", "ambient_town_8", "ambient_town_9", "ambient_town_10", "ambient_town_11", "ambient_town_12", "ambient_town_13"], "camp": ["scout", "campmerchant", "camphealer", "traveler", "campcook_odo", "ambient_camp_0", "ambient_camp_1", "ambient_camp_2", "ambient_camp_3"], "dusk": ["duskhead", "wood", "duskmerchant", "duskhealer", "weaver_mira", "ambient_dusk_0", "ambient_dusk_1", "ambient_dusk_2", "ambient_dusk_3", "ambient_dusk_4"], "moon": ["seer", "herbalist", "moonmerchant", "moonhealer", "cartographer", "researcher_sol", "ambient_moon_0", "ambient_moon_1", "ambient_moon_2", "ambient_moon_3"], "forgecamp": ["artificer", "forgemerchant", "forgehealer", "forgeguard", "quartermaster_bran", "ambient_forgecamp_0", "ambient_forgecamp_1", "ambient_forgecamp_2", "ambient_forgecamp_3"], "elderhouse1": ["housekeeper_mara", "secretary_elin", "cook_bram", "guest_roan", "aide_sena"], "elderhouse2": ["archivist_nora", "astronomer_vega", "apprentice_tio", "scribe_luna"]};
for(const [area,ids] of Object.entries(V6_AREA_PORTRAITS)){AREA_PORTRAITS[area]=AREA_PORTRAITS[area]||[];for(const id of ids)if(!AREA_PORTRAITS[area].includes(id))AREA_PORTRAITS[area].push(id)}
const _buildAmbientBeforeV6=buildAmbientNPCs;buildAmbientNPCs=function(area){_buildAmbientBeforeV6(area);for(let i=0;i<ambientNPCs.length;i++){const n=ambientNPCs[i],id='ambient_'+area+'_'+i;n.id=id;n.actor=V6_ACTOR_MAP[id]||n.actor;n.portraitId=id}};
interaction=function(){if(mode!=='play')return;const t=interactiveTargetV5();if(!t)return toast('附近沒有可互動的物件');if(t.kind==='npc')return talk(t.o);if(t.kind==='ambient'){t.o.chat=2.7;t.o.wait=Math.max(t.o.wait,2.2);nextPortrait=t.o.portraitId||t.o.id;return modalShow('💬 '+t.o.name,`<p>「${t.o.line}」</p><p class="muted">這位居民只會在自己的街區附近活動。</p>`,[{title:'結束對話',detail:'按 F 也可關閉',primary:true,action:()=>{}}],'✦ 星燈鎮居民 ✦')}if(t.kind==='furniture')return interactFurniture(t.o);if(t.kind==='door')return useDoor(t.o);if(t.kind==='gate')return changeArea(t.o.to);if(t.kind==='node')return gather(t.o)};
window.addEventListener('keydown',ev=>{if(ev.key.toLowerCase()==='f'&&!modal.hidden&&mode==='dialog'){ev.preventDefault();ev.stopImmediatePropagation();modalClose()}},true);
portraitMarkup=function(id,cls='portrait-box'){const src=id==='hero'?heroPortrait():npcPortrait(id);return `<div class="${cls}"><img data-portrait-id="${id}" alt="${id==='hero'?'冒險者':'NPC'} 肖像" width="256" height="256" decoding="async" src="${src}"></div>`};
drawNPC=function(n){const near=distance(hero,n)<115;g.save();g.globalAlpha=1;g.shadowBlur=0;g.fillStyle='#0a1b1795';g.beginPath();g.ellipse(n.x,n.y+29,23,7,0,0,TWO);g.fill();if(n.id.includes('board'))objDraw('book',n.x,n.y+20,60,71);else actorDraw(n.actor||n.id,n.x,n.y+20,0,0,68,68);const text=n.name;g.font='bold 15px system-ui';const tw=Math.min(195,Math.max(80,g.measureText(text).width+26));g.fillStyle=near?'#103b32ed':'#0a2b27d9';g.beginPath();g.roundRect(n.x-tw/2,n.y-82,tw,29,7);g.fill();g.strokeStyle=near?'#f4d384':'#a0b98370';g.lineWidth=near?2:1;g.stroke();g.textAlign='center';g.fillStyle='#fff0c1';g.fillText(text,n.x,n.y-63);if(['elder','guard','scout','seer'].includes(n.id)&&s.main!==6){g.fillStyle='#fff0b2';g.strokeStyle='#875726';g.lineWidth=2;g.font='bold 27px system-ui';g.strokeText('!',n.x,n.y-92);g.fillText('!',n.x,n.y-92)}if(near){g.fillStyle='#f8dca0';g.font='bold 13px system-ui';g.fillText('F 交談',n.x,n.y+50)}g.restore()};
drawAmbientNPC=function(n){const near=distance(hero,n)<80;g.save();g.globalAlpha=1;g.shadowBlur=0;g.fillStyle='#09191573';g.beginPath();g.ellipse(n.x,n.y+25,19,6,0,0,TWO);g.fill();const frame=n.wait>0?0:(Math.floor(n.step)%2?1:2);actorDraw(n.actor,n.x,n.y+18,n.dir,frame,64,64);if(near){g.fillStyle='#0d3029e8';g.fillRect(n.x-70,n.y-60,140,26);g.strokeStyle='#f4d384';g.strokeRect(n.x-70,n.y-60,140,26);g.fillStyle='#fff0be';g.font='bold 13px system-ui';g.textAlign='center';g.fillText('F 對話 · '+n.name,n.x,n.y-42)}g.restore()};
window.starwoodPortraitFormat='static-webp-ready-for-animated-webp';

const _baseLoadAreaOptimized=loadArea;
loadArea=function(id,spawn){_baseLoadAreaOptimized(id,spawn);setTimeout(()=>scheduleAdjacentPrefetch(id),700)};
const _baseChangeAreaOptimized=changeArea;
changeArea=function(to){preloadAreaAssets(to).finally(()=>_baseChangeAreaOptimized(to))};
if(typeof useDoor==='function'){const _baseUseDoorOptimized=useDoor;useDoor=function(d){if(!d)return;preloadAreaAssets(d.to).finally(()=>_baseUseDoorOptimized(d))}}

// ===== v8: town guide map, 1/4 ambient population, upgraded ambient/monster art =====
window.starwoodArtVersion='v8-town-map-ambient-monster-upgrade';
AMBIENT_COUNTS.town=4;
AREA_PORTRAITS.town=(AREA_PORTRAITS.town||[]).filter(id=>!id.startsWith('ambient_town_')||['ambient_town_0','ambient_town_1','ambient_town_2','ambient_town_3'].includes(id));
preloadUrl('assets/ui/town_map.webp');
function openTownMap(){
 const left=clamp(hero.x/GW*100,2,98),top=clamp(hero.y/GH*100,2,98);
 const marker=s.area==='town'?`<div style="position:absolute;left:${left}%;top:${top}%;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:#ffe59b;border:3px solid #18483c;box-shadow:0 0 0 3px #fff4c766,0 2px 8px #0008;z-index:3" title="目前位置"></div>`:'';
 modalShow('🗺️ 星燈鎮導覽地圖',`<p>主幹道與中央廣場維持寬通道；功能建築依行政、商業、生活與工匠區分布。</p><div style="position:relative;max-width:768px;margin:10px auto"><img src="assets/ui/town_map.webp" alt="星燈鎮導覽地圖" style="display:block;width:100%;height:auto;border:2px solid #d7b873;border-radius:12px;image-rendering:auto">${marker}</div><p class="endline">目前主城僅保留 4 位移動居民，降低擁擠與誤觸；固定任務 NPC 不受影響。</p>`,[{title:'查看世界地圖',action:()=>openWorldMap()},{title:'返回遊戲',primary:true,action:()=>{}}],'✦ STARLIGHT TOWN MAP ✦')
}
const _worldMapV8=openWorldMap;
openWorldMap=function(){const cards=ORDER.map(id=>{const a=AREAS[id],unlocked=canGo(id);return `<div class="worldcard"><b>${unlocked?a.emoji:'🔒'} ${a.name}</b><small>${a.safe?'安全據點':'野外打怪區'} · Lv. ${a.level}</small><small>${a.subtitle}</small>${unlocked&&a.safe?`<button class="small-btn" data-modalwarp="${id}" ${s.area===id?'disabled':''}>${s.area===id?'目前位置':'快速旅行'}</button>`:''}</div>`}).join('');modalShow('🗺️ 星森世界地圖',`<p>每個安全據點都有居民與委託，野外有怪物、採集物與通往其他地區的傳送門。</p>${canGo('town')?'<button class="choice" id="townDetailMap" style="width:100%;margin:0 0 10px"><strong>🏘️ 查看星燈鎮詳細導覽圖</strong><small>建築、道路與功能分區</small></button>':''}<div class="worldgrid">${cards}</div><p class="endline">只能在安全區快速旅行到其他已解鎖的安全區。野外請使用地圖中的傳送門。</p>`,[{title:'返回遊戲',primary:true,full:true}],'✦ EXPLORATION MAP ✦');const mapBtn=dialog.querySelector('#townDetailMap');if(mapBtn)mapBtn.onclick=()=>openTownMap();dialog.querySelectorAll('[data-modalwarp]').forEach(el=>el.addEventListener('click',()=>{if(!areaInfo().safe)return toast('需先回到安全區才能快速旅行');modalClose();changeArea(el.dataset.modalwarp)}))};
$('mapBtn').addEventListener('click',ev=>{if(s.area==='town'){ev.preventDefault();ev.stopImmediatePropagation();openTownMap()}},true);

preloadAreaAssets('town').finally(()=>{loadArea('town',{x:550,y:470});startMenu();switchTab('hero');requestAnimationFrame(loop)});
})();
</script>
