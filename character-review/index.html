const COLS=[[30,120],[170,262],[319,410],[454,548],[593,684],[731,825],[865,969],[1008,1101],[1152,1230],[1279,1369],[1415,1508]];
// Inclusive content ranges exclude only the number-label bands. The character art in the source PNG remains unchanged.
const ROWS=[[0,140],[159,296],[314,446],[468,594],[614,747],[747,849],[868,965]];
const src=new Image();
src.src="../assets/authority/64px/authority_77_numbered.png";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const main=document.getElementById("list");
const canvases=[];
for(const char of DATA){
 const row=document.createElement("article");
 row.innerHTML='<div class="head"><span class="num">'+char.n+'</span><span class="name">'+esc(char.name)+'</span><span class="region">'+esc(char.region||"")+'</span></div>'+

 '<div class="col"><div class="caption">走路</div><div class="directions">'+["上","下","左","右"].map(s=>'<div class="dir"><b>'+s+'</b><span>待製作</span></div>').join("")+'</div></div></div>';
 main.append(row);
 canvases.push(row.querySelector("canvas"));
}
function drawAll(){
 if(src.naturalWidth!==1536||src.naturalHeight!==980)return;
 canvases.forEach((canvas,i)=>{
  const cx=i%11,cy=Math.floor(i/11);
  const [x0,x1]=COLS[cx],[y0,y1]=ROWS[cy],w=x1-x0+1,h=y1-y0+1;
  const ctx=canvas.getContext("2d");ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,140,140);
  ctx.drawImage(src,x0,y0,w,h,(140-w)/2,(140-h)/2,w,h);
 });
}
if(src.complete&&src.naturalWidth)drawAll();else src.addEventListener("load",drawAll,{once:true});
</script>
