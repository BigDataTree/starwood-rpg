<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>星森傳說｜第三批 21–30 位四方向行走圖集</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1b23;color:#e5f0e8;font-family:system-ui,"Noto Sans TC",sans-serif}main{max-width:1180px;padding:18px;margin:auto}
h1{font-size:clamp(24px,5vw,34px);color:#f4e0a7;margin:10px 0}p{color:#b5d1c5;line-height:1.7}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 24px}nav a{padding:12px 16px;background:#315646;border:1px solid #719c87;border-radius:9px;color:white;text-decoration:none;font-weight:600}
.note{font-size:13px;color:#f0d69e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.card{border:1px solid #41645a;background:#173039;border-radius:16px;padding:16px}
.card h2{font-size:20px;margin:0;color:#f5dba3}.state{font-size:12px;color:#b3cbbf;margin:6px 0 12px}
.dirs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#10252a;padding:8px;border-radius:9px}
figure{margin:0;min-width:0;text-align:center}figcaption{font-size:12px;color:#b6d1c5;margin-top:6px}canvas.piece{width:100%;image-rendering:pixelated;aspect-ratio:1}
.atlas{display:block;max-width:100%;width:192px;height:256px;image-rendering:pixelated;margin:16px auto;border:1px solid #49675e;background:#23413f}
.export{display:block;text-align:center;padding:10px;background:#244c42;border:1px solid #5d967d;border-radius:9px;color:#fff0c8;text-decoration:none}
small{color:#aac9b6}footer{padding:26px;color:#b5d1c5}input{accent-color:#72c59d}
</style></head><body><main><h1>🌲 星森傳說｜第三批：21–30 位</h1>
<p>每位角色 4 方向 × 3 個姿態，共 12 格。觀看正面、左側、右側、背面時請注意腳底對齊、面部方向、角色配件與換格連貫度。</p>
<p class="note">美術品質標示：第 21 位為獨立重繪候選；第 22～30 位為既有美術改編候選，尚未完成逐位最終美術驗收，不代表已正式上架。</p>
<nav><a href="./v119-batch3-game-preview.html">🎮 進入完整遊戲測試</a><a href="./">返回 v1.1.8 正式版</a></nav>
<label><input type="checkbox" id="animate" checked> 自動播放左右腳步</label>
<div id="grid" class="grid"></div><footer>圖片大小：每格 64×64，圖集 192×256；圖集列序：正面／左側／右側／背面。</footer></main>
<script>
const people=[{"n":21,"id":"duskhealer","name":"林語治癒師"},{"n":22,"id":"seer","name":"月泉預言者"},{"n":23,"id":"herbalist","name":"藥草師蒂娜"},{"n":24,"id":"moonmerchant","name":"月泉補給商"},{"n":25,"id":"moonhealer","name":"月泉治癒師"},{"n":26,"id":"cartographer","name":"觀星地圖師"},{"n":27,"id":"artificer","name":"星鑄工匠"},{"n":28,"id":"forgemerchant","name":"礦工商隊"},{"n":29,"id":"forgehealer","name":"堡壘醫護員"},{"n":30,"id":"forgeguard","name":"礦坑警衛"}];
const root=document.getElementById('grid');const items=[];const dirs=['正面 ↓','左側 ←','右側 →','背面 ↑'];
for(const p of people){
 const card=document.createElement('article');card.className='card';
 const title=document.createElement('h2');title.textContent=p.n+'｜'+p.name;card.append(title);
 const st=document.createElement('p');st.className='state';st.textContent=p.n===21?'獨立重繪候選':'既有美術改編候選';card.append(st);
 const grid=document.createElement('div');grid.className='dirs';card.append(grid);
 const views=[];
 for(let d=0;d<4;d++){const fig=document.createElement('figure'),cv=document.createElement('canvas');cv.width=64;cv.height=64;cv.className='piece';fig.append(cv);const cap=document.createElement('figcaption');cap.textContent=dirs[d];fig.append(cap);grid.append(fig);views.push(cv)}
 const sheet=document.createElement('canvas');sheet.width=192;sheet.height=256;sheet.className='atlas';card.append(sheet);
 const a=document.createElement('a');a.className='export';a.textContent='下載這位角色的 PNG 圖集';a.href='assets/walk64-batch3/'+p.n+'_'+p.id+'_64x64_4dir_3walk.png';a.download=p.n+'_'+p.id+'.png';card.append(a);
 const state=document.createElement('small');state.textContent='載入中…';card.append(state);
 const im=new Image(); const item={views,sheet,im,ready:false};items.push(item);
 im.onload=()=>{if(im.naturalWidth!==192||im.naturalHeight!==256){state.textContent='尺寸錯誤';return}sheet.getContext('2d').drawImage(im,0,0);item.ready=true;state.textContent='12格已載入';draw(item,1)};
 im.onerror=()=>state.textContent='圖集無法載入，請重新整理';
 im.src=a.href;root.append(card);
}
function draw(item,f){if(!item.ready)return;for(let d=0;d<4;d++){const c=item.views[d].getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,64,64);c.drawImage(item.im,f*64,d*64,64,64,0,0,64,64)}}
let tick=0;setInterval(()=>{if(!document.getElementById('animate').checked)return;tick=(tick+1)%4;for(const item of items)draw(item,[1,0,1,2][tick])},180);
</script></body></html>
