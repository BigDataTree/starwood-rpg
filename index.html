(async()=>{const files=["game-data/v1.1.6/part-01.txt","game-data/v1.1.6/part-02.txt","game-data/v1.1.6/part-03.txt","game-data/v1.1.6/part-04.txt"],status=document.getElementById('status'),bar=document.getElementById('bar');try{const texts=await Promise.all(files.map(async(path)=>{const r=await fetch(path,{cache:'default'});if(!r.ok)throw Error(path+' HTTP '+r.status);const t=await r.text();bar.value=Math.round((++window.__swdone/files.length)*100);return t}));const original=texts.join('');const anchor="function actorDraw(key,x,y,dir=0,frame=0,w=64,h=64){";const patch="// ── Starwood RPG v1.1.6 · walk20 sprite prototype integration ──\n// 20 signed-off IDs, 64×64 native cells, 4 directions × 3 walk frames.\n// Other characters, monster movement and game systems stay untouched.\nconst SW64_WALK_FILES={\"novice\":\"01_novice_64x64_4dir_3walk.png\",\"knight\":\"02_knight_64x64_4dir_3walk.png\",\"mage\":\"03_mage_64x64_4dir_3walk.png\",\"ranger\":\"04_ranger_64x64_4dir_3walk.png\",\"elder\":\"05_elder_64x64_4dir_3walk.png\",\"merchant\":\"06_merchant_64x64_4dir_3walk.png\",\"smith\":\"07_smith_64x64_4dir_3walk.png\",\"trainer\":\"08_trainer_64x64_4dir_3walk.png\",\"healer\":\"09_healer_64x64_4dir_3walk.png\",\"guard\":\"10_guard_64x64_4dir_3walk.png\",\"librarian\":\"11_librarian_64x64_4dir_3walk.png\",\"child\":\"12_child_64x64_4dir_3walk.png\",\"guide\":\"13_guide_64x64_4dir_3walk.png\",\"scout\":\"14_scout_64x64_4dir_3walk.png\",\"campmerchant\":\"15_campmerchant_64x64_4dir_3walk.png\",\"camphealer\":\"16_camphealer_64x64_4dir_3walk.png\",\"traveler\":\"17_traveler_64x64_4dir_3walk.png\",\"duskhead\":\"18_duskhead_64x64_4dir_3walk.png\",\"wood\":\"19_wood_64x64_4dir_3walk.png\",\"duskmerchant\":\"20_duskmerchant_64x64_4dir_3walk.png\"};\nconst SW64_WALK_IMAGES=Object.create(null);\nfunction sw64GetWalkImage(key){\n const id=String(key??'').replace(/^v6_/, '');\n const file=SW64_WALK_FILES[id];\n if(!file)return null;\n let im=SW64_WALK_IMAGES[id];\n if(!im){\n  im=new Image(); im.decoding='async'; im.src='assets/walk64/'+file;\n  SW64_WALK_IMAGES[id]=im;\n }\n if(!im.complete||im.naturalWidth!==192||im.naturalHeight!==256)return null;\n return im;\n}\nfunction actorDraw(key,x,y,dir=0,frame=0,w=64,h=64){\n const im=sw64GetWalkImage(key);\n if(im){\n  const d=Math.max(0,Math.min(3,dir|0));\n  let f=Math.max(0,Math.min(2,frame|0));\n  // Center frame is a neutral stance when the player stands still.\n  if(key===s.cls&&Math.abs(x-hero.x)<.01&&!hero.moving)f=1;\n  // Foot anchor: in the native 64×64 cells the last opaque row is y≈58.\n  // Display stays 64×64, aligned with v1.1.6 ground shadows.\n  g.drawImage(im,f*64,d*64,64,64,Math.round(x-32),Math.round(y-52),64,64);\n  return true;\n }\n // Defer to the unchanged v1.1.6 rendering for missing/non-WIP actors.\n return actorDrawLegacy(key,x,y,dir,frame,w,h);\n}\nfunction actorDrawLegacy(key,x,y,dir=0,frame=0,w=64,h=64){";if(!original.includes(anchor))throw Error('v1.1.6 render hook missing');const full=original.replace(anchor,patch);if(!full.startsWith('<!doctype html>')||!full.includes('v1.1.6')||!full.trimEnd().endsWith('</html>'))throw Error('遊戲資料驗證失敗');status.textContent='正在啟動遊戲…';document.open();document.write(full);document.close()}catch(e){status.textContent='載入失敗：'+String(e.message||e);document.getElementById('again').hidden=false;console.error(e)}})();window.__swdone=0;
