.cell{min-width:0}

.photo,.pixel{display:flex;justify-content:center;align-items:center;width:100%;aspect-ratio:1;background:#66c368;overflow:hidden;border-radius:4px;text-decoration:none;color:#174b30}

.dirs{display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:5px;min-height:0}

.dir b{font-size:clamp(16px,2.5vw,24px);font-weight:500}
.dir canvas{display:block;width:min(95%,58px);max-height:58px;aspect-ratio:1;image-rendering:pixelated}
.dir .dash{font-size:17px;color:#478e80}
.hint{font-size:10px;color:#61796d;text-align:right;margin-top:5px}
@media(max-width:620px){
header{padding:10px 12px}
h1{font-size:17px}
main{padding:8px 5px 24px;gap:9px}
.row{padding:6px;border-radius:9px;contain-intrinsic-size:auto 220px}
.rowhead{height:30px;padding:0 3px 5px}
.rowhead strong{font-size:13px}
.num{font-size:12px;padding:4px 5px}
.region{font-size:10px}
.columns{gap:6px;padding:7px;grid-template-columns:1fr 1fr .84fr}
.cellhead{font-size:11px;margin-bottom:4px}
.dir{grid-template-columns:minmax(20px,.55fr) minmax(0,1fr)}
.dir b{font-size:17px}
.dir canvas{width:min(100%,34px);max-height:34px}
.dirs{gap:3px}
.missing{font-size:11px}

@media(prefers-reduced-motion:reduce){.dir canvas,.pixel canvas{animation:none}}

for(const item of DATA){
 const el=document.createElement("section");el.className="row";el.dataset.n=item.n;
 const dirs=labelDirs.map(([name,y])=>'<div class="dir"><b>'+name+'</b>'+(item.sheet?'<canvas width="64" height="64" data-y="'+y+'"></canvas>':'<span class="dash">—</span>')+'</div>').join("");
 el.innerHTML='<div class="rowhead"><span class="num">'+item.n+'</span><strong>'+escapeHTML(item.name)+'</strong><span class="region">'+escapeHTML(item.region||"")+'</span></div>'+
 '<div class="columns"><div class="cell"><div class="cellhead">特寫圖</div><a class="photo" href="'+escapeHTML(item.portrait)+'" target="_blank" aria-label="放大特寫：'+escapeHTML(item.name)+'"><img src="'+escapeHTML(item.portrait)+'" loading="lazy" alt="'+escapeHTML(item.name)+'" onerror="this.outerHTML=\'<span class=&quot;missing&quot;>尚無圖像</span>\'"></a></div>'+
 '<div class="cell"><div class="cellhead">64px</div>'+(item.sheet?'<a class="pixel" href="'+escapeHTML(item.sheet)+'" target="_blank" aria-label="開啟64px圖集：'+escapeHTML(item.name)+'"><canvas width="64" height="64"></canvas></a>':'<div class="pixel"><span class="missing">待製作</span></div>')+'</div>'+
 '<div class="cell"><div class="cellhead">走路</div><div class="dirs">'+dirs+'</div></div></div>';
 main.appendChild(el);
 if(item.sheet){
   sprites.set(el,{item,main:el.querySelector(".pixel canvas"),dirs:[...el.querySelectorAll(".dir canvas")],image:null});
 }
}
function frame(ctx,img,y,f){
 if(!ctx||!img||img.naturalWidth!==192||img.naturalHeight!==256)return;
 ctx.clearRect(0,0,64,64);ctx.imageSmoothingEnabled=false;
 ctx.drawImage(img,f*64,y*64,64,64,0,0,64,64);
}
function render(el,f){
 const o=sprites.get(el);if(!o?.image)return;
 frame(o.main.getContext("2d"),o.image,0,f);
 for(const canvas of o.dirs)frame(canvas.getContext("2d"),o.image,Number(canvas.dataset.y),f);
}
const observer=new IntersectionObserver(entries=>{
 for(const entry of entries){
   const el=entry.target;
   if(entry.isIntersecting){
    active.add(el);
    const o=sprites.get(el);
    if(o&&!o.image){
     const im=new Image();o.image=im;
     im.onload=()=>render(el,1);
     im.onerror=()=>{o.image=null;el.querySelectorAll("canvas").forEach(c=>c.replaceWith(Object.assign(document.createElement("span"),{className:"dash",textContent:"—"})))};
     im.src=o.item.sheet;
    }
   }else active.delete(el);
 }
},{rootMargin:"180px"});
for(const el of main.children)observer.observe(el);
let beat=0;
setInterval(()=>{if(document.hidden)return;const f=[1,0,1,2][beat++%4];for(const el of active)render(el,f)},240);
</script>
</body>
</html>
