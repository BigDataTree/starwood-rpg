<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星森傳說｜職業外觀對照</title>
<style>body{margin:0;background:linear-gradient(150deg,#10241f,#213d37);font:16px system-ui,"Noto Sans TC",sans-serif;color:#e9f3e8}main{max-width:1100px;margin:auto;padding:28px 16px 55px}h1{font-size:clamp(27px,5vw,42px);margin:8px 0}p{line-height:1.7;color:#c3d7cc}.note{border:1px solid #577b6d;background:#243e37;padding:14px;border-radius:12px}.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}.card{background:#20332f;border:1px solid #527468;border-radius:15px;padding:12px;text-align:center}.card h2{font-size:19px}.pics{display:grid;grid-template-columns:1fr 1fr;gap:9px}.pic{min-width:0}.pic img{width:100%;height:180px;object-fit:contain;image-rendering:pixelated;background:#132822;border-radius:8px}.pic small{display:block;font-size:12px;color:#c1d3c7;padding:7px 0}.status{font-size:12px;color:#d3de91;margin:10px 0}.links{margin-top:25px}.links a{color:#a5f4cb}footer{font-size:12px;color:#adc0b7;margin-top:24px}@media(max-width:750px){.row{grid-template-columns:1fr}.pics img{height:210px}}@media(max-width:400px){.pics img{height:150px}}</style></head>
<body><main><h1>🌲 星森傳說｜職業外觀對照</h1><p>這次做的是三個新像素角色的<strong>候選設計</strong>。左側為 GitHub 上原本的 WebP 頭像，右側為本次新製作的 SVG 設計稿。尚未更改正式遊戲。</p>
<div class="note">已確認三張原始頭像內容完全相同（相同 Git SHA），並不代表遊戲一定使用它們。這份頁面讓你先看造型方向，並非遊戲測試完成的證明。</div><div class="row" id="cards"></div>
<p class="links">其他角色：<a href="review.html">瀏覽 73 位 NPC 肖像</a></p><footer>每一張候選 SVG 都有獨立檔案，可編輯。若要真正套入遊戲，需檢查原程式的圖檔引用、畫面比例及相容性；不會直接覆蓋原圖。</footer>
<script>const root='https://raw.githubusercontent.com/BigDataTree/starwood-rpg/automation/npc-sprite-audit-20261120/';
const roles=[{key:'knight',name:'騎士',idea:'銀色盔甲、盾甲輪廓、長劍'},{key:'novice',name:'新手',idea:'藍色學徒服、暖色頭髮、星光法杖'},{key:'ranger',name:'遊俠',idea:'深綠兜帽、弓箭、森林斗篷'}];
for(const r of roles){const card=document.createElement('section');card.className='card';const title=document.createElement('h2');title.textContent=r.name;const pics=document.createElement('div');pics.className='pics';for(const [label,path] of [['修改前','assets/common/avatar_'+r.key+'.webp'],['候選新設計','art/candidates/'+r.key+'.svg']]){const pane=document.createElement('div');pane.className='pic';const img=document.createElement('img');img.src=root+path;img.alt=r.name+label;const small=document.createElement('small');small.textContent=label;pane.append(img,small);pics.append(pane);}const tip=document.createElement('div');tip.className='status';tip.textContent=r.idea;card.append(title,pics,tip);document.getElementById('cards').append(card)}</script></main></body></html>
