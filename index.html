<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>星森傳說 v1.1.6｜載入遊戲</title><style>html,body{margin:0;height:100%;background:#09151b;color:#f2e6cb;font-family:system-ui,"Noto Sans TC",sans-serif}main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;padding:22px;text-align:center}h1{font-size:26px}p{max-width:450px;color:#b0cfc8}progress{width:min(80vw,330px);height:12px;accent-color:#82d8af}button{background:#254b43;border:1px solid #81caa9;border-radius:8px;color:#fff0bd;padding:11px 24px;cursor:pointer}</style></head><body><main><h1>🌲 星森傳說</h1><p id="status">正在載入 v1.1.6 的冒險世界…</p><progress id="bar" max="100" value="0"></progress><button id="again" hidden onclick="location.reload()">重新載入</button><noscript>請開啟 JavaScript 以遊玩。</noscript></main><script>
(async()=>{const files=["game-data/v1.1.6/part-01.txt","game-data/v1.1.6/part-02.txt","game-data/v1.1.6/part-03.txt","game-data/v1.1.6/part-04.txt"],status=document.getElementById('status'),bar=document.getElementById('bar');try{const texts=await Promise.all(files.map(async(path)=>{const r=await fetch(path,{cache:'default'});if(!r.ok)throw Error(path+' HTTP '+r.status);const t=await r.text();bar.value=Math.round((++window.__swdone/files.length)*100);return t}));const full=texts.join('');if(!full.startsWith('<!doctype html>')||!full.includes('v1.1.6')||!full.trimEnd().endsWith('</html>'))throw Error('遊戲資料驗證失敗');status.textContent='正在啟動遊戲…';document.open();document.write(full);document.close()}catch(e){status.textContent='載入失敗：'+String(e.message||e);document.getElementById('again').hidden=false;console.error(e)}})();window.__swdone=0;
</script></body></html>
