<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>001–005 四方向行走驗收</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3ef;color:#193b31;font:15px system-ui}header{position:sticky;top:0;background:white;padding:10px;z-index:2;border-bottom:1px solid #baccc0}button,select{padding:8px;margin:3px}main{max-width:1100px;margin:auto;padding:10px}article{background:white;border:1px solid #cad8ce;border-radius:9px;margin-bottom:12px;padding:10px}h2{font-size:16px;margin:4px}.rows{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.row{text-align:center;overflow:auto}canvas{image-rendering:pixelated;display:block;margin:5px auto;max-width:100%;height:auto;background:#f4f6f4}.frames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px}.frames[hidden]{display:none}small{color:#5e6d64}.reference{display:flex;align-items:center;gap:8px}.reference canvas{margin:0;width:64px}.warn{color:#875c21}@media(max-width:550px){.rows{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><header><b>001–005｜四方向三影格</b><div><button id="play">暫停</button><button id="step">下一格</button><select id="speed"><option value="150">150 ms</option><option selected value="250">250 ms</option><option value="500">500 ms</option></select><select id="zoom"><option value="1">1×</option><option selected value="2">2×</option><option value="4">4×</option><option value="8">8×</option><option value="16">16×</option></select><label><input type="checkbox" id="grid">格線</label> <label><input type="checkbox" id="all">三格並排</label></div><small id="status">載入中</small></header><main id="main"></main><script src="../idle-review/source-1.js"></script><script>
const $=id=>document.getElementById(id),names=['01_novice','02_knight','03_mage','04_ranger','05_elder'],dirs=['下','左','右','上'],entries=[];let running=true,tick=0,prev=0;const sequence=[0,1,2,1];
function canvas(w,h){let c=document.createElement('canvas');c.width=w;c.height=h;return c}
async function imageOf(src){let im=new Image();im.src=src;await im.decode();return im}
function normalize(im){if(im.width!==192||im.height!==256)throw Error('圖集尺寸錯誤');let src=canvas(192,256),ctx=src.getContext('2d');ctx.drawImage(im,0,0);let data=ctx.getImageData(0,0,192,256);for(let i=0;i<data.data.length;i+=4){if(data.data[i+3]<128)data.data.fill(0,i,i+4);else data.data[i+3]=255}ctx.putImageData(data,0,0);return src}
function paint(c,s,r,f,z){c.width=c.height=64*z;let ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.drawImage(s,f*64,r*64,64,64,0,0,64*z,64*z);if($('grid').checked&&z>1){ctx.strokeStyle='#9ca69e';ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<=64;i++){ctx.moveTo(i*z+.5,0);ctx.lineTo(i*z+.5,64*z);ctx.moveTo(0,i*z+.5);ctx.lineTo(64*z,i*z+.5)}ctx.stroke()}}
function draw(){let z=+$('zoom').value;for(let e of entries)for(let r=0;r<4;r++){let row=e.rows[r];paint(row.querySelector('canvas'),e.s,r,sequence[tick],z);let fs=row.querySelector('.frames');fs.hidden=!$('all').checked;if(!fs.hidden)fs.querySelectorAll('canvas').forEach((c,f)=>paint(c,e.s,r,f,z))}}
async function init(){for(let i=0;i<5;i++){let s=normalize(await imageOf('../assets/walk64-v118/'+names[i]+'_64x64_4dir_3walk.png'));let a=document.createElement('article');a.innerHTML='<h2>'+String(i+1).padStart(3,'0')+'</h2><div class="reference"><canvas width="64" height="64"></canvas><small>本批原正面參考／下方為既有行走候選，造型需比對</small></div><div class="rows">'+dirs.map(d=>'<div class="row"><b>'+d+'</b><canvas></canvas><div class="frames" hidden><canvas></canvas><canvas></canvas><canvas></canvas></div></div>').join('')+'</div><a download="'+names[i]+'_walk.png">192×256 PNG</a>';let ref=await imageOf('data:image/png;base64,'+window.SPRITES[i]),tmp=canvas(513,513),tc=tmp.getContext('2d');tc.drawImage(ref,0,0);let p=tc.getImageData(0,0,513,513).data,rc=a.querySelector('.reference canvas').getContext('2d'),d=rc.createImageData(64,64);for(let y=0;y<64;y++)for(let x=0;x<64;x++){let j=((y*8+4)*513+x*8+4)*4,k=(y*64+x)*4;d.data.set(p.subarray(j,j+4),k)}rc.putImageData(d,0,0);a.querySelector('a').href=s.toDataURL('image/png');$('main').append(a);entries.push({s,rows:a.querySelectorAll('.row')});draw()}$('status').textContent='5 位／60 格｜既有行走素材候選・透明度二值化・不減色・待造型驗收';requestAnimationFrame(loop)}
function loop(t){if(running&&t-prev>=+$('speed').value){tick=(tick+1)%4;prev=t;draw()}requestAnimationFrame(loop)}$('play').onclick=()=>{running=!running;$('play').textContent=running?'暫停':'播放'};$('step').onclick=()=>{running=false;$('play').textContent='播放';tick=(tick+1)%4;draw()};for(let k of ['zoom','grid','all'])$(k).onchange=draw;init().catch(e=>$('status').textContent='載入失敗：'+e.message);
</script></html>
